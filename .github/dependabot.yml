version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    assignees:
      - josh-hemphill
    open-pull-requests-limit: 2
    labels:
      - npm
      - dep
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    assignees:
      - josh-hemphill
    open-pull-requests-limit: 1
    labels:
      - actions
      - triage
      - dep
